<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFIG - Grupo de Foguetes</title>
</head>

<body>

    <!-- Header com menu de navegação -->
    <header class="header">
        <nav>
            <ul class="menu">
                <li><a href="index.html#inicio">Início</a></li>
                <li><a href="index.html#sobre">Quem Somos</a></li>
                <li><a href="projetos.html">Nossos Foguetes</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="tela">

        <!-- Seção 1: Início / Home -->
        <section class="container1" id="inicio">
            <img class="background" src="gifinho.gif" alt="Background Espacial">

            <div class="logo" id="logoCard">
                <img src="02_emblema-removebg-preview.png" alt="Logo GFIG">
            </div>

            <div class="conteudo-texto">
                <p class="um">GFIG => Projetando o <span>futuro</span> da engenharia <br>aeroespacial a partir de<span>Gaspar</span>.</p>

                <div class="conteudo-texto2">
                    <p class="dois">Transformamos ciência em tecnologia aeroespacial de alto impacto.</p>
                </div>

                <div class="botoes-grupo">
                    <a href="projetos.html" class="btn-inicio">Conhecer Projetos</a>
                    <a href="#sobre" class="btn-inicio btn-secundario">Ver Vídeo Oficial</a>
                </div>
            </div>
        </section>

        <!-- Seção 2: Equipe (Agora preparada para o CSS Grid) -->
        <section class="container2" id="sobre">
            <h2 class="equipe">Equipe</h2>

            <div class="equipe-grid">
                <div class="membro">
                    <img src="romulo.png" alt="" class="integrantes">
                    <p>Romulo</p>
                </div>

                <div class="membro">
                    <img src="henrrique.png" alt="" class="integrantes">
                    <p>Henrique</p>
                </div>

                <div class="membro">
                    <img src="vitor.png" alt="" class="integrantes">
                    <p>Vitor</p>
                </div>

                <div class="membro">
                    <img src="mauricio.png" alt="" class="integrantes">
                    <p>Mauricio</p>
                </div>

                <div class="membro">
                    <img src="rauta.png" alt="" class="integrantes">
                    <p>Rauta</p>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
